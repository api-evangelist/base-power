aid: base-power
name: Base Power
description: 'Base Power (Base Texas REP, LLC, PUCT License #10338) is an Austin, Texas home
  energy company that pairs an installed home battery (40–80 kWh) with retail electricity
  service across Texas and Illinois. The battery powers a home automatically during outages
  with no manual switch and helps lower the energy bill: batteries charge when grid demand
  is low and send power back to the grid when demand is high (grid-balancing), and that
  grid revenue helps keep member energy rates low. Base can be the retail electricity provider
  with or without a battery, works with existing solar, and serves the Oncor, CenterPoint,
  AEP Texas, TNMP, CoServ, GVEC, Farmers Electric, and El Paso Electric areas in Texas plus
  ComEd in Illinois. Led by CEO Zach Dell and co-founder Justin Lopas; named to the TIME100
  Most Influential Companies (2026); backed by Andreessen Horowitz, Lightspeed Venture
  Partners, Addition, Bond Capital, Ribbit Capital, and Spark Capital. This profile was
  enriched by the API Evangelist pipeline; Base publishes no public developer API.'
